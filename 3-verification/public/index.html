<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f7f7f8;
      min-height: 100vh;
      padding: 48px 20px;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #111;
      letter-spacing: -0.5px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #888;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d1d5db;
      transition: background 0.3s;
    }
    .dot.ok { background: #22c55e; }
    .dot.err { background: #ef4444; }

    .add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .add-row input {
      flex: 1;
      padding: 11px 14px;
      border: 1px solid #e2e2e2;
      border-radius: 8px;
      font-size: 15px;
      background: #fff;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .add-row input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }
    .add-row input::placeholder { color: #bbb; }

    .btn-add {
      padding: 11px 18px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .btn-add:hover { background: #4f46e5; }
    .btn-add:active { background: #4338ca; }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 8px;
      transition: opacity 0.2s;
    }
    .task.done { opacity: 0.45; }

    .task input[type="checkbox"] {
      width: 17px;
      height: 17px;
      cursor: pointer;
      accent-color: #6366f1;
      flex-shrink: 0;
    }

    .task-title {
      flex: 1;
      font-size: 15px;
      color: #1a1a1a;
      user-select: none;
    }
    .task.done .task-title {
      text-decoration: line-through;
      color: #aaa;
    }

    .btn-del {
      background: none;
      border: none;
      color: #ccc;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 0 2px;
      transition: color 0.15s;
    }
    .btn-del:hover { color: #ef4444; }

    .empty {
      text-align: center;
      padding: 52px 0;
      color: #bbb;
      font-size: 15px;
    }

    .footer {
      margin-top: 14px;
      font-size: 12px;
      color: #bbb;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>TaskFlow</h1>
      <div class="status">
        <div class="dot" id="dot"></div>
        <span id="statusLabel">connecting…</span>
      </div>
    </header>

    <div class="add-row">
      <input id="input" type="text" placeholder="New task…" maxlength="200" />
      <button class="btn-add" onclick="addTask()">Add</button>
    </div>

    <div class="task-list" id="list"></div>
    <div class="footer" id="footer"></div>
  </div>

  <script>
    async function checkHealth() {
      try {
        const r = await fetch('/health');
        if (r.ok) {
          document.getElementById('dot').className = 'dot ok';
          document.getElementById('statusLabel').textContent = 'connected';
          return;
        }
      } catch {}
      document.getElementById('dot').className = 'dot err';
      document.getElementById('statusLabel').textContent = 'disconnected';
    }

    async function load() {
      const r = await fetch('/api/tasks');
      const tasks = await r.json();
      render(tasks);
    }

    function render(tasks) {
      const list = document.getElementById('list');
      const footer = document.getElementById('footer');

      if (!tasks.length) {
        list.innerHTML = '<div class="empty">No tasks yet — add one above</div>';
        footer.textContent = '';
        return;
      }

      list.innerHTML = tasks.map(t => `
        <div class="task ${t.completed ? 'done' : ''}" id="t-${t.id}">
          <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggle(${t.id})">
          <span class="task-title">${esc(t.title)}</span>
          <button class="btn-del" onclick="del(${t.id})">×</button>
        </div>
      `).join('');

      const done = tasks.filter(t => t.completed).length;
      footer.textContent = `${done} / ${tasks.length} complete`;
    }

    async function addTask() {
      const input = document.getElementById('input');
      const title = input.value.trim();
      if (!title) return;
      await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title }),
      });
      input.value = '';
      load();
    }

    async function toggle(id) {
      await fetch(`/api/tasks/${id}`, { method: 'PUT' });
      load();
    }

    async function del(id) {
      await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
      load();
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    document.getElementById('input').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask();
    });

    checkHealth();
    load();
  </script>
</body>
</html>
